services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: smart_clinic
      MYSQL_USER: clinic
      MYSQL_PASSWORD: ${DB_PASSWORD:-clinic_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_password}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/procedures.sql:/docker-entrypoint-initdb.d/02-procedures.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
  app:
    build: .
    restart: unless-stopped
    ports: ["8080:8080"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/smart_clinic
      DB_USER: clinic
      DB_PASSWORD: ${DB_PASSWORD:-clinic_dev_password}
      JWT_SECRET: ${JWT_SECRET:-development-only-change-me-32-plus-bytes-secret}
      SPRING_PROFILES_ACTIVE: demo
volumes:
  mysql_data:
