<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Portal | Smart Clinic</title><link rel="stylesheet" href="/css/style.css"></head><body data-role="ADMIN"><header><div class="brand">✚ Smart Clinic <small>Admin Portal</small></div><nav><a href="/">Home</a><button class="logout hidden">Sign out</button></nav></header><main><section class="login card" id="login"><span class="eyebrow">ADMINISTRATOR ACCESS</span><h1>Welcome back, Admin.</h1><p>Sign in to manage clinic providers.</p><form id="loginForm"><label>Email<input type="email" name="email" placeholder="admin@clinic.test" required></label><label>Password<input type="password" name="password" placeholder="Enter password" required></label><button type="submit">Sign in to Admin Portal</button></form><p class="message" id="loginMessage"></p></section><section class="dashboard hidden" id="dashboard"><span class="eyebrow">ADMIN CONTROL CENTER</span><h1>Doctor management</h1><div class="grid"><div class="card"><h2>Add a doctor</h2><form id="addDoctor"><label>Full name<input name="name" required placeholder="Dr. Sarah Patel"></label><label>Specialty<input name="specialty" required placeholder="Cardiology"></label><label>Available time<input name="availableTime" required placeholder="09:00-17:00"></label><label>Email<input type="email" name="email" required></label><label>Initial password<input type="password" name="password" minlength="10" required></label><button type="submit">Add doctor</button></form><p class="message" id="actionMessage"></p></div><div class="card"><h2>Current doctors</h2><div id="doctorList">Loading...</div></div></div></section></main><script src="/js/portal.js"></script></body></html>
