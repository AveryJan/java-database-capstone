spring.application.name=smart-clinic
server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_clinic?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:clinic}
spring.datasource.password=${DB_PASSWORD:clinic_dev_password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jackson.serialization.write-dates-as-timestamps=false
app.jwt.secret=${JWT_SECRET:development-only-change-me-32-plus-bytes-secret}
app.jwt.expiration-ms=3600000
management.endpoints.web.exposure.include=health,info
