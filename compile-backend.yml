name: Compile and test Java backend
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Navigate to backend and compile
        run: |
          cd app
          ../mvnw -f ../pom.xml clean compile
      - name: Test backend
        run: ./mvnw test
