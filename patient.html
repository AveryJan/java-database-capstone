<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Patient Portal | Smart Clinic</title><link rel="stylesheet" href="/css/style.css"></head><body data-role="PATIENT"><header><div class="brand">✚ Smart Clinic <small>Patient Portal</small></div><nav><a href="/">Home</a><button class="logout hidden">Sign out</button></nav></header><main><section class="login card" id="login"><span class="eyebrow">PATIENT ACCESS</span><h1>Your health, organized.</h1><p>Sign in to discover doctors and manage your appointments.</p><form id="loginForm"><label>Email<input type="email" name="email" placeholder="jordan@clinic.test" required></label><label>Password<input type="password" name="password" required></label><button type="submit">Sign in to Patient Portal</button></form><p class="message" id="loginMessage"></p></section><section class="dashboard hidden" id="dashboard"><span class="eyebrow">PATIENT WORKSPACE</span><h1>Find a doctor</h1><div class="card"><form id="findDoctors"><label>Search by doctor name<input name="name" placeholder="Dr. Maya Chen"></label><label>Specialty<input name="specialty" placeholder="Cardiology"></label><label>Available time<input name="time" placeholder="09:00"></label><button type="submit">Search doctors</button></form><div id="doctorList"></div></div><div class="card"><h2>Book an appointment</h2><form id="book"><label>Doctor ID<input name="doctorId" type="number" min="1" required></label><label>Appointment date &amp; time<input name="appointmentTime" type="datetime-local" required></label><button type="submit">Book appointment</button></form><p class="message" id="actionMessage"></p></div><div class="card"><h2>My appointments</h2><div id="appointments">Loading...</div></div></section></main><script src="/js/portal.js"></script></body></html>
