<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Doctor Portal | Smart Clinic</title><link rel="stylesheet" href="/css/style.css"></head><body data-role="DOCTOR"><header><div class="brand">✚ Smart Clinic <small>Doctor Portal</small></div><nav><a href="/">Home</a><button class="logout hidden">Sign out</button></nav></header><main><section class="login card" id="login"><span class="eyebrow">DOCTOR ACCESS</span><h1>Welcome back, Doctor.</h1><p>Access your appointments and patient schedule.</p><form id="loginForm"><label>Email<input type="email" name="email" placeholder="maya@clinic.test" required></label><label>Password<input type="password" name="password" required></label><button type="submit">Sign in to Doctor Portal</button></form><p class="message" id="loginMessage"></p></section><section class="dashboard hidden" id="dashboard"><span class="eyebrow">DOCTOR WORKSPACE</span><h1>My patient appointments</h1><div class="card"><h2>Scheduled appointments</h2><div id="appointments">Loading...</div></div><div class="card"><h2>Issue a prescription</h2><p class="small">Only use synthetic patients in this demonstration.</p><form id="prescribe"><label>Patient ID<input name="patientId" type="number" min="1" required></label><label>Medication / instructions<input name="medication" required></label><button type="submit">Save prescription</button></form><p class="message" id="actionMessage"></p></div></section></main><script src="/js/portal.js"></script></body></html>
